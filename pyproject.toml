[project]
name = "briefkasten"
version = "0.1.0"
description = "Personal AI news brief: fetch, rank with Claude, deliver to Telegram"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "trafilatura>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/briefkasten"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
