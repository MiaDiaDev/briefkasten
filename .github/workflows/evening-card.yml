name: evening-card

on:
  schedule:
    # Mon-Sat 16:23 UTC = 18:23 CEST / 17:23 CET (odd minute: see daily-brief.yml)
    - cron: "23 16 * * 1-6"
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write # commits data/card_state.json back

concurrency:
  group: evening-card
  cancel-in-progress: false

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync

      - name: Send card
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m briefkasten.card

      - name: Commit state
        run: |
          git config user.name "briefkasten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update card state [skip ci]"
          git pull --rebase && git push
