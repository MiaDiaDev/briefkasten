name: daily-brief

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily (cron is always UTC)
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write # to commit data/seen.json back

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m briefkasten.main

      - name: Commit state
        run: |
          git config user.name "briefkasten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "chore: update seen state [skip ci]"
          git push
